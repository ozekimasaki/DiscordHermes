discord:
  require_mention: true

group_sessions_per_user: true

mcp_servers:
  discord_admin:
    command: "python"
    args: ["<REPO_ROOT>/scripts/launch_discord_admin_mcp.py"]
    env:
      DISCORD_ADMIN_DB_PATH: "<REPO_ROOT>/.state/discord-admin.db"
      DISCORD_REQUEST_TIMEOUT_SECONDS: "15"
    tools:
      include:
        - get_guild_summary
        - list_categories
        - list_channels
        - list_roles
        - get_member
        - list_members_by_role
        - create_role
        - assign_role
        - remove_role
        - create_text_channel
        - archive_channel
        - move_channel_to_category
        - post_announcement
      prompts: false
      resources: false

# Recommended:
# - run `python scripts/install_extension.py --hermes-home ~/.hermes`
# - merge the generated `discord-admin.config.snippet.yaml`
# - keep DISCORD_BOT_TOKEN in ~/.hermes/.env rather than duplicating it here
