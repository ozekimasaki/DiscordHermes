[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-discord-admin-extension"
version = "0.1.0"
description = "Companion MCP server and skills for Hermes-based Discord administration"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "masam" }]
license = { text = "MIT" }

[project.scripts]
discord-admin-mcp = "extensions.mcp.discord_admin_server.server:main"

[tool.setuptools.packages.find]
include = ["extensions", "extensions.*"]

